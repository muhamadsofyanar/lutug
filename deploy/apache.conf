<VirtualHost *:80>
    DocumentRoot /var/www/html
    Alias /backend/api/index.php /var/www/app/backend/api/index.php
    Alias /uploads/ /data/uploads/
    <Directory /var/www/html>
        Require all granted
        AllowOverride None
        Options -Indexes
        FallbackResource /index.html
    </Directory>
    <Directory /var/www/app>
        Require all denied
    </Directory>
    <Directory /var/www/app/backend/api>
        <Files index.php>
            Require all granted
        </Files>
    </Directory>
    <Directory /data/uploads>
        Require all granted
        AllowOverride None
        Options -Indexes -ExecCGI
        SetHandler default-handler
        Header set X-Content-Type-Options nosniff
        Header set Content-Disposition attachment
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|html?|svg|js)$">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
